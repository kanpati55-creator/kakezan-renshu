<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="かけ算">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>かけ算 れんしゅう</title>
<style>
  :root {
    --bg: #fff8e7;
    --ink: #3a2f2a;
    --red: #e5484d;
    --blue: #2f6fed;
    --ok: #2fa84f;
    --card: #ffffff;
    --line: #e6d9bd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 20px;
    -webkit-user-select: none; user-select: none;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  h1 { font-size: 29px; text-align: center; margin: 8px 0 2px; }
  .sub { text-align: center; margin: 0 0 8px; font-size: 16px; }
  .screen { display: none; }
  .screen.on { display: block; }

  button {
    font: inherit; color: inherit; cursor: pointer;
    border: 3px solid var(--line); background: var(--card);
    border-radius: 18px; padding: 14px 12px;
    box-shadow: 0 4px 0 var(--line);
    touch-action: manipulation;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .sel { border-color: var(--blue); box-shadow: 0 4px 0 var(--blue); background: #eaf1ff; }
  .primary { background: var(--blue); border-color: #1f55c4; box-shadow: 0 4px 0 #1f55c4; color: #fff; font-weight: bold; }
  .primary:active { box-shadow: 0 1px 0 #1f55c4; }
  .hide { display: none !important; }

  .label { font-weight: bold; margin: 14px 0 7px; font-size: 18px; }
  .row { display: grid; gap: 9px; }
  .c2 { grid-template-columns: 1fr 1fr; }
  .c5 { grid-template-columns: repeat(5, 1fr); }

  /* だんの ボタン */
  .dan { position: relative; padding: 9px 0; font-size: 22px; font-weight: bold; line-height: 1.1; border-radius: 15px; }
  .dan small { display: block; font-size: 11px; font-weight: normal; }
  .dan .stamp { position: absolute; top: -9px; right: -5px; font-size: 19px; }
  .dan.all { font-size: 15px; }
  .ord { font-size: 17px; font-weight: bold; padding: 11px 4px; white-space: nowrap; }
  .ord small { display: block; font-size: 12px; font-weight: normal; }
  .mode { font-size: 21px; font-weight: bold; text-align: left; padding: 13px 16px; }
  .mode small { display: block; font-size: 14px; font-weight: normal; margin-top: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .top button { padding: 8px 14px; font-size: 17px; border-radius: 14px; }
  .prog { font-weight: bold; }
  .bar { height: 10px; background: var(--line); border-radius: 6px; margin: 10px 0 0; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 6px; transition: width .25s; }

  /* もんだい */
  .q { text-align: center; font-size: min(60px, 15vw); font-weight: bold; margin: 12px 0 0; letter-spacing: 2px; white-space: nowrap; }
  .q .a { color: var(--red); }
  .q .b { color: var(--blue); }
  .q .ans { display: inline-block; min-width: 1.5em; padding: 0 6px; border-bottom: 5px solid var(--ink); }
  .q .ans.good { color: var(--ok); border-color: var(--ok); }
  .q .ans.bad { color: var(--red); border-color: var(--red); }
  .yomi { text-align: center; font-size: 21px; font-weight: bold; min-height: 30px; margin: 4px 0 2px; color: var(--ok); }
  .msg { text-align: center; font-size: 20px; font-weight: bold; min-height: 28px; margin: 2px 0 8px; }
  .msg.ok { color: var(--ok); }
  .msg.no { color: var(--red); }

  /* ヒント（おはじきの え） */
  .hintbox { background: var(--card); border: 3px dashed var(--line); border-radius: 16px; padding: 8px 12px; margin: 0 0 10px; text-align: center; display: none; }
  .hint .hintbox { display: block; }
  .hintbox .txt { font-size: 17px; font-weight: bold; line-height: 1.5; }
  .hintbox .txt .a { color: var(--red); }
  .hintbox .txt .b { color: var(--blue); }
  .dots { display: inline-grid; gap: 3px 10px; margin-top: 4px; grid-auto-flow: column; }
  .dots span { display: flex; gap: 3px; padding: 2px 5px; border: 2px solid var(--blue); border-radius: 9px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--red); display: block; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choices button { font-size: 32px; font-weight: bold; padding: 14px 6px; }
  .choices button.ng { border-color: var(--red); background: #fdeaea; box-shadow: 0 4px 0 var(--red); }
  .choices button.good, .pad button.good { border-color: var(--ok); background: #e3f6e8; box-shadow: 0 4px 0 var(--ok); }
  .choices button.dim { opacity: .35; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pad button { font-size: 28px; font-weight: bold; padding: 9px 0; border-radius: 15px; }
  .pad button.sm { font-size: 18px; }

  .under { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-top: 12px; }
  .under button { font-size: 17px; white-space: nowrap; padding: 13px 4px; }

  /* 九九の ひょう */
  .tabs { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; margin: 12px 0 8px; }
  .tabs button { padding: 8px 0; font-size: 20px; font-weight: bold; border-radius: 12px; }
  .tbl { background: var(--card); border: 3px solid var(--line); border-radius: 18px; overflow: hidden; }
  .tr { display: grid; grid-template-columns: 1fr 1.25fr; align-items: center; padding: 0 12px; height: min(52px, 6.6svh); border-top: 2px solid var(--line); }
  .tr:first-child { border-top: 0; }
  .tr .f { font-size: 25px; font-weight: bold; white-space: nowrap; }
  .tr .f .a { color: var(--red); }
  .tr .f .b { color: var(--blue); }
  .tr .y { font-size: 16px; text-align: right; white-space: nowrap; }
  .tr .v, .tr .y { transition: opacity .15s; }
  .kakusu .tr:not(.open) .v { opacity: 0; }
  .kakusu .tr:not(.open) .y { opacity: 0; }
  .note { text-align: center; font-size: 14px; margin: 8px 0 0; min-height: 20px; }

  .stars { text-align: center; font-size: 46px; letter-spacing: 4px; margin: 18px 0 4px; }
  .result { text-align: center; font-size: 27px; font-weight: bold; margin: 8px 0; }
  .miss { background: var(--card); border: 3px dashed var(--line); border-radius: 16px; padding: 10px 14px; margin: 12px 0; font-size: 18px; line-height: 1.7; }
  .miss b { font-size: 21px; }
  .miss .ttl { font-weight: bold; color: var(--red); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ホーム -->
  <div id="home" class="screen on">
    <h1>✖️ かけ算 れんしゅう</h1>
    <p class="sub">九九を おぼえよう！</p>

    <div class="label">① だんを えらぶ <span style="font-weight:normal;font-size:14px">（いくつでも）</span></div>
    <div class="row c5" id="dans"></div>

    <div class="label">② ならびかた</div>
    <div class="row c2">
      <button class="ord" data-ord="jun">じゅんばん<small>×1 から ×9 へ</small></button>
      <button class="ord" data-ord="bara">ばらばら<small>まぜて 出す</small></button>
    </div>

    <div class="label">③ あそびかた</div>
    <div class="row">
      <button class="mode" data-mode="table">📖 九九を みる<small>となえかたを たしかめる</small></button>
      <button class="mode" data-mode="choice">👆 えらぶ<small>4つから こたえを えらぶ</small></button>
      <button class="mode" data-mode="pad">🔢 すうじで こたえる<small>こたえを じぶんで 入れる</small></button>
    </div>
  </div>

  <!-- 九九を みる -->
  <div id="table" class="screen">
    <div class="top">
      <button class="back">← もどる</button>
      <button id="kakusuBtn">こたえを かくす</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="tbl" id="tbl"></div>
    <p class="note" id="tblNote"></p>
  </div>

  <!-- もんだい -->
  <div id="quiz" class="screen">
    <div class="top">
      <button class="back">← やめる</button>
      <span class="prog" id="prog"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>

    <div class="q"><span class="a" id="qa"></span> × <span class="b" id="qb"></span> = <span class="ans" id="qans">？</span></div>
    <div class="yomi" id="yomi"></div>
    <div class="msg" id="msg"></div>

    <div class="hintbox">
      <div class="txt" id="hintTxt"></div>
      <div class="dots" id="dots"></div>
    </div>

    <div class="choices" id="choices"></div>
    <div class="pad" id="pad"></div>

    <div class="under">
      <button id="hintBtn">💡 ヒント</button>
      <button id="nextBtn" class="primary">つぎへ →</button>
    </div>
  </div>

  <!-- けっか -->
  <div id="done" class="screen">
    <h1>おつかれさま！</h1>
    <div class="stars" id="stars"></div>
    <div class="result" id="result"></div>
    <p class="sub" id="resultSub"></p>
    <div class="miss hide" id="miss"></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="againBtn" style="font-size:21px">もういちど</button>
      <button id="missBtn" style="font-size:19px;font-weight:bold">まちがえた もんだいだけ</button>
      <button class="back" style="font-size:19px">さいしょに もどる</button>
    </div>
  </div>

</div>
<script>
(function () {
  'use strict';

  // 九九の となえかた（[だん][かける数]）
  var Y = {
    1: ['いんいちが いち','いんにが に','いんさんが さん','いんしが し','いんごが ご','いんろくが ろく','いんしちが しち','いんはちが はち','いんくが く'],
    2: ['にいちが に','ににんが し','にさんが ろく','にしが はち','にご じゅう','にろく じゅうに','にしち じゅうし','にはち じゅうろく','にく じゅうはち'],
    3: ['さんいちが さん','さんにが ろく','さざんが く','さんし じゅうに','さんご じゅうご','さぶろく じゅうはち','さんしち にじゅういち','さんぱ にじゅうし','さんく にじゅうしち'],
    4: ['しいちが し','しにが はち','しさん じゅうに','しし じゅうろく','しご にじゅう','しろく にじゅうし','ししち にじゅうはち','しは さんじゅうに','しく さんじゅうろく'],
    5: ['ごいちが ご','ごに じゅう','ごさん じゅうご','ごし にじゅう','ごご にじゅうご','ごろく さんじゅう','ごしち さんじゅうご','ごは しじゅう','ごっく しじゅうご'],
    6: ['ろくいちが ろく','ろくに じゅうに','ろくさん じゅうはち','ろくし にじゅうし','ろくご さんじゅう','ろくろく さんじゅうろく','ろくしち しじゅうに','ろくは しじゅうはち','ろっく ごじゅうし'],
    7: ['しちいちが しち','しちに じゅうし','しちさん にじゅういち','しちし にじゅうはち','しちご さんじゅうご','しちろく しじゅうに','しちしち しじゅうく','しちは ごじゅうろく','しちく ろくじゅうさん'],
    8: ['はちいちが はち','はちに じゅうろく','はちさん にじゅうし','はちし さんじゅうに','はちご しじゅう','はちろく しじゅうはち','はちしち ごじゅうろく','はっぱ ろくじゅうし','はっく しちじゅうに'],
    9: ['くいちが く','くに じゅうはち','くさん にじゅうしち','くし さんじゅうろく','くご しじゅうご','くろく ごじゅうし','くしち ろくじゅうさん','くは しちじゅうに','くく はちじゅういち']
  };
  var MAX_BARA = 20;   // ばらばらで いちどに 出す数の上限

  var $ = function (id) { return document.getElementById(id); };
  var all = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

  // ---- きろく（この端末の中だけに のこす） ----
  var store = { dans: [2], ord: 'jun', stamps: {} };
  try {
    var saved = JSON.parse(localStorage.getItem('kakezan') || 'null');
    if (saved && saved.dans && saved.dans.length) store = saved;
    if (!store.stamps) store.stamps = {};
  } catch (e) {}
  function save() { try { localStorage.setItem('kakezan', JSON.stringify(store)); } catch (e) {} }

  function show(id) {
    all('.screen').forEach(function (s) { s.classList.toggle('on', s.id === id); });
    window.scrollTo(0, 0);
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---- ホーム ----
  function drawHome() {
    var box = $('dans'); box.innerHTML = '';
    for (var d = 1; d <= 9; d++) {
      var b = document.createElement('button');
      b.className = 'dan' + (store.dans.indexOf(d) >= 0 ? ' sel' : '');
      b.dataset.dan = d;
      b.innerHTML = d + '<small>のだん</small>' + (store.stamps[d] ? '<span class="stamp">💮</span>' : '');
      box.appendChild(b);
    }
    var a = document.createElement('button');
    a.className = 'dan all' + (store.dans.length === 9 ? ' sel' : '');
    a.dataset.dan = 'all';
    a.innerHTML = 'ぜんぶ';
    box.appendChild(a);
    all('.ord').forEach(function (o) { o.classList.toggle('sel', o.dataset.ord === store.ord); });
  }
  $('dans').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.dan === 'all') {
      store.dans = store.dans.length === 9 ? [2] : [1,2,3,4,5,6,7,8,9];
    } else {
      var d = +b.dataset.dan, i = store.dans.indexOf(d);
      if (i >= 0) { if (store.dans.length > 1) store.dans.splice(i, 1); }
      else store.dans.push(d);
      store.dans.sort();
    }
    save(); drawHome();
  });
  all('.ord').forEach(function (o) {
    o.addEventListener('click', function () { store.ord = o.dataset.ord; save(); drawHome(); });
  });
  all('.mode').forEach(function (m) {
    m.addEventListener('click', function () {
      if (m.dataset.mode === 'table') openTable(store.dans[0]);
      else startQuiz(m.dataset.mode, null);
    });
  });
  all('.back').forEach(function (b) {
    b.addEventListener('click', function () { clearTimeout(timer); drawHome(); show('home'); });
  });

  // ---- 九九を みる ----
  var tblDan = 2;
  function openTable(d) {
    tblDan = d;
    var tabs = $('tabs'); tabs.innerHTML = '';
    for (var i = 1; i <= 9; i++) {
      var t = document.createElement('button');
      t.textContent = i; t.dataset.dan = i;
      if (i === d) t.className = 'sel';
      tabs.appendChild(t);
    }
    var h = '';
    for (var k = 1; k <= 9; k++) {
      h += '<div class="tr"><div class="f"><span class="a">' + d + '</span> × <span class="b">' + k +
           '</span> = <span class="v">' + (d * k) + '</span></div><div class="y">' + Y[d][k - 1] + '</div></div>';
    }
    $('tbl').innerHTML = h;
    drawKakusu();
    show('table');
  }
  function drawKakusu() {
    var on = $('tbl').classList.contains('kakusu');
    $('kakusuBtn').textContent = on ? 'こたえを 見せる' : 'こたえを かくす';
    $('kakusuBtn').classList.toggle('sel', on);
    $('tblNote').textContent = on ? 'こえに 出して いってから、さわって たしかめよう' : 'こえに 出して よんでみよう';
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) openTable(+b.dataset.dan);
  });
  $('kakusuBtn').addEventListener('click', function () {
    $('tbl').classList.toggle('kakusu');
    all('#tbl .tr').forEach(function (r) { r.classList.remove('open'); });
    drawKakusu();
  });
  $('tbl').addEventListener('click', function (e) {
    var r = e.target.closest('.tr'); if (r) r.classList.toggle('open');
  });

  // ---- もんだい ----
  var S = null;       // いまの れんしゅうの じょうたい
  var timer = 0;

  function startQuiz(mode, list) {
    var qs;
    if (list) {
      qs = list.slice();
    } else {
      qs = [];
      store.dans.forEach(function (d) { for (var k = 1; k <= 9; k++) qs.push([d, k]); });
      if (store.ord === 'bara') { shuffle(qs); qs = qs.slice(0, MAX_BARA); }
    }
    S = {
      mode: mode, qs: qs, i: 0, miss: [], locked: false, typed: '',
      // 1つの だんを ぜんぶ（9もん）やる ときだけ はなまるの たいしょう
      stampDan: (!list && store.dans.length === 1) ? store.dans[0] : 0
    };
    $('quiz').classList.remove('hint');
    $('choices').classList.toggle('hide', mode !== 'choice');
    $('pad').classList.toggle('hide', mode !== 'pad');
    show('quiz');
    ask();
  }

  function ask() {
    var q = S.qs[S.i], a = q[0], b = q[1];
    S.locked = false; S.typed = ''; S.wrong = false;
    $('prog').textContent = (S.i + 1) + ' / ' + S.qs.length + ' もんめ';
    $('bar').style.width = (S.i / S.qs.length * 100) + '%';
    $('qa').textContent = a; $('qb').textContent = b;
    $('qans').textContent = '？'; $('qans').className = 'ans';
    $('yomi').textContent = ''; $('msg').textContent = ''; $('msg').className = 'msg';
    $('nextBtn').classList.add('hide');
    $('quiz').classList.remove('hint');
    drawHint(a, b);
    if (S.mode === 'choice') drawChoices(a, b); else drawPad();
  }

  // 「a が b つぶん」を おはじきで 見せる
  function drawHint(a, b) {
    var plus = []; for (var i = 0; i < b; i++) plus.push(a);
    $('hintTxt').innerHTML = '<span class="a">' + a + '</span> が <span class="b">' + b + '</span>つぶん' +
      (b > 1 ? '<br><span class="a">' + plus.join(' + ') + '</span>' : '');
    var h = '';
    for (var g = 0; g < b; g++) {
      h += '<span>'; for (var d = 0; d < a; d++) h += '<i></i>'; h += '</span>';
    }
    var box = $('dots');
    box.innerHTML = h;
    // たてに ならべる数（おおい ときは 2れつに わける）
    box.style.gridTemplateRows = 'repeat(' + (b > 5 && a <= 6 ? Math.ceil(b / 2) : b) + ', auto)';
  }

  function drawChoices(a, b) {
    var ans = a * b, set = [ans];
    // まちがえやすい こたえを まぜる（となりの九九・たし算）
    var cand = shuffle([a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, a + b, ans + 1, ans - 1, ans + 10, ans - 10, a * (b + 2)]);
    for (var i = 0; i < cand.length && set.length < 4; i++) {
      if (cand[i] > 0 && cand[i] <= 81 && set.indexOf(cand[i]) < 0) set.push(cand[i]);
    }
    for (var n = 2; set.length < 4; n++) if (set.indexOf(n) < 0) set.push(n);
    set.sort(function (x, y) { return x - y; });
    var box = $('choices'); box.innerHTML = '';
    set.forEach(function (v) {
      var bt = document.createElement('button');
      bt.textContent = v; bt.dataset.v = v;
      box.appendChild(bt);
    });
  }
  $('choices').addEventListener('click', function (e) {
    var bt = e.target.closest('button'); if (!bt || S.locked) return;
    var q = S.qs[S.i], ok = +bt.dataset.v === q[0] * q[1];
    if (!ok) bt.classList.add('ng');
    all('#choices button').forEach(function (x) {
      if (+x.dataset.v === q[0] * q[1]) x.classList.add('good');
      else if (x !== bt) x.classList.add('dim');
    });
    judge(ok);
  });

  function drawPad() {
    var box = $('pad');
    if (!box.firstChild) {
      ['1','2','3','4','5','6','7','8','9','けす','0','こたえる'].forEach(function (k) {
        var bt = document.createElement('button');
        bt.textContent = k; bt.dataset.k = k;
        if (k === 'けす') bt.className = 'sm';
        if (k === 'こたえる') bt.className = 'sm primary';
        box.appendChild(bt);
      });
    }
  }
  $('pad').addEventListener('click', function (e) {
    var bt = e.target.closest('button'); if (!bt || S.locked) return;
    var k = bt.dataset.k;
    if (k === 'けす') S.typed = S.typed.slice(0, -1);
    else if (k === 'こたえる') {
      if (!S.typed) return;
      var q = S.qs[S.i];
      judge(+S.typed === q[0] * q[1]);
      return;
    }
    else if (S.typed.length < 2) S.typed = (S.typed === '0' ? '' : S.typed) + k;
    $('qans').textContent = S.typed || '？';
  });

  function judge(ok) {
    var q = S.qs[S.i], ans = q[0] * q[1];
    S.locked = true;
    $('yomi').textContent = Y[q[0]][q[1] - 1];
    $('qans').textContent = ans;
    if (ok) {
      $('qans').className = 'ans good';
      $('msg').textContent = 'せいかい！ ⭕'; $('msg').className = 'msg ok';
      timer = setTimeout(next, 1100);
    } else {
      S.miss.push(q);
      $('qans').className = 'ans bad';
      $('msg').textContent = 'ざんねん… こたえは ' + ans + ' だよ'; $('msg').className = 'msg no';
      $('quiz').classList.add('hint');
      $('nextBtn').classList.remove('hide');
    }
  }
  function next() {
    clearTimeout(timer);
    S.i++;
    if (S.i < S.qs.length) ask(); else finish();
  }
  $('nextBtn').addEventListener('click', next);
  $('hintBtn').addEventListener('click', function () { $('quiz').classList.toggle('hint'); });

  // ---- けっか ----
  function finish() {
    var total = S.qs.length, good = total - S.miss.length;
    var star = good === total ? 3 : good >= total * 0.7 ? 2 : 1;
    $('stars').textContent = '⭐️⭐️⭐️'.slice(0, star * 2) + '☆☆☆'.slice(0, 3 - star);
    $('result').textContent = total + 'もん中 ' + good + 'もん せいかい';
    var sub = good === total ? 'ぜんぶ せいかい！ すごい！' : 'まちがえた もんだいを もういちど やってみよう';
    if (good === total && S.stampDan) {
      store.stamps[S.stampDan] = 1; save();
      sub = S.stampDan + 'のだん ごうかく！ 💮 はなまるを もらったよ';
    }
    $('resultSub').textContent = sub;
    var m = $('miss');
    if (S.miss.length) {
      var seen = {}, h = '<div class="ttl">まちがえた もんだい</div>';
      S.miss.forEach(function (q) {
        var key = q[0] + 'x' + q[1]; if (seen[key]) return; seen[key] = 1;
        h += '<div><b>' + q[0] + ' × ' + q[1] + ' = ' + (q[0] * q[1]) + '</b>　' + Y[q[0]][q[1] - 1] + '</div>';
      });
      m.innerHTML = h;
    }
    m.classList.toggle('hide', !S.miss.length);
    $('missBtn').classList.toggle('hide', !S.miss.length);
    show('done');
  }
  $('againBtn').addEventListener('click', function () { startQuiz(S.mode, null); });
  $('missBtn').addEventListener('click', function () {
    var seen = {}, list = S.miss.filter(function (q) {
      var key = q[0] + 'x' + q[1]; if (seen[key]) return false; seen[key] = 1; return true;
    });
    startQuiz(S.mode, shuffle(list));
  });

  drawHome();
})();
</script>
</body>
</html>
